[project]
name = "item-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.18.2"
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"